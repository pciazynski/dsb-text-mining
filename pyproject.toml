[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dsb-text-mining"
version = "0.1.0"
description = "Lower Sorbian text-mining ETL and browser digilab"
readme = "README.md"
requires-python = ">=3.10"

[project.optional-dependencies]
test = ["pytest>=8", "pytest-cov"]

[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
pythonpath = ["etl"]
testpaths = ["tests/python"]
addopts = "-ra"
