<!doctype html>
<html>
<head>
	<meta charset="utf-8">
	<script src="../../_assets/datahandler.js"></script>
	<script src="../../lib/config.js"></script>
</head>

<body style="text-align:left;">
<script type = "module">
	var dataset = getQueryVariable('data')
	var filter = getQueryVariable('item')
	var data_arr = (await readTextFile_async(dataset)).trim("\n").split('\n')
	var str = '<head><link rel="stylesheet" href="../../digilabstyles.css"></head><div style="font-size:2rem;">'
	data_arr = data_arr.sort()
	for (var i = 0; i < data_arr.length; i++) {
		var linearr = data_arr[i].split(sep)
		if(filter === linearr[0]){
			str += data_arr[i]+'</br>'
		}
	}
	
	str += '</div>';
	document.write(str)
	data_arr = ""
	str = ""
	document.title = dataset

</script>
</body>
