<script>


	var switchDtsCts = function(){
		elsrc = document.getElementById('doclist').src;
		if(elsrc.includes("&textapi=dts")){
			document.getElementById('doclist').src = elsrc.replace("&textapi=dts","")
		}else{
			document.getElementById('doclist').src = elsrc+"&textapi=dts"
		}
	}
	
	var updateWord = function(){
		if(curtypo.length>0){
			loading('doclist')
			document.getElementById('typo').src = 'item.html?data=typorecognition/typos&item='+curtypo
			document.getElementById('doclist').src = 'doclist.html?data=urnbyword.php&word='+curtypo
		}
	}
	
	var itemclick = function(item){
		curtypo = item
		updateWord()
	}
	
	var resettypolist = function(){
		document.getElementById('typolist').src = 'itemlist.html?data=typorecognition/typowords&unique=1'
	}
	
	var timelineclick = function(item){
		document.getElementById('typolist').src = 'itemlist.html?data=typorecognition/typowords&unique=1&year='+item
		document.getElementById('typo').src = "error_selecttoken.html"
		document.getElementById('doclist').src = "error_selecttoken.html"
	}
	
	
	document.getElementById('typolist').src = 'itemlist.html?data=typorecognition/typowords&unique=1'
	document.getElementById('timeline').src = 'hist_timeline.html?data=typorecognition/typowords'
	document.getElementById('typo').src = "error_selecttoken.html"
	document.getElementById('doclist').src = "error_selecttoken.html"
	document.title=lang_typorec
	curtypo = getQueryVariable("typo")
	updateWord()

</script>
