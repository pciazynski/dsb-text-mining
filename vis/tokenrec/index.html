<!DOCTYPE html>
<meta charset="utf-8">

<head>
	<script src="../../lib/config.js"></script>
	<script src="../../lib/def_language.js"></script>
	<script src="../../lib/my_language.js"></script>
	<script src="../../_assets/datahandler.js"></script>
	<script src="../../_assets/gui.js"></script>
	<link rel="stylesheet" href="../../digilabstyles.css">
</head>

<body style="background-color:lightgray">

<script>document.write(header())</script>
		
<br><br>

<div class="explain">
	<p>
		Hier niedersorbischen Text einfügen:
	</p>
</div>

<table class='optionmenu' align='center'>
	<tr>
		<td>
			<textarea  style="width:90%;height:200px;" value = "" type="text" id="inputtext" onchange="recognise()"></textarea >
		</td>
	</tr>
</table>

<br><br>

<div class = "explain">
	<p>
		<span style="color:green;"> ▮ </span>In Daten enthalten<br>
		<span style="color:black;"> ▮ </span>In Daten nicht enthalten<br>
		
	</p>
</div>

<table class='optionmenu' align='center'>
	<tr>
		<td>
			<div style="width:90%;background-color:white;">
				<label  style="width:90%;height:200px;" value = "" type="text" id="wordrec" onchange="recognise()"></label >
			</div>
		</td>
	</tr>
</table>

	
<script>

	var recognise = function(){
		var punctRE = /[\\'!"#$%&()*+,.\/:;=?@\[\]^_`{|}~]/g;
		//var punctRE = /[\u2000-\u206F\u2E00-\u2E7F\\'!"#$%&()*+,.\/:;=?@\[\]^_`{|}~]/g;
		document.getElementById('wordrec').innerHTML = "Loading..."
		text = " "+document.getElementById("inputtext").value.replaceAll("\n", ' <br> ').replace(punctRE, ' ').toLowerCase()+" "
		textarr = text.split(" ").sort()
		oldword = ""
		
		knownlist = "\n"+readTextFile("bagofwords/_all");
		for (var i = 0;i<textarr.length;i++){
			word = textarr[i].trim()
			if(oldword!== word){
				onclickfun = "window.open('../../vis/docreferences/?word="+word+"')"
				//onclickfun = "showwordinfo('"+word+"')"
				if(knownlist.includes("\n"+word+"\t")){
					text = text.replaceAll(" "+word+" ", ' <span class="clickableword" style="cursor:pointer;color:green;" onclick="'+onclickfun+'">'+word+'</span> ')
				}	
				else {
					text = text.replaceAll(" "+word+" ", ' <span style="color:black;">'+word +'</span> ')
				}
				oldword = word
			}
		}
		
		document.getElementById('wordrec').innerHTML=text
	}



</script>

<br><br>

<script>
	document.write(footer())
</script>

</body>
