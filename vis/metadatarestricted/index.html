<script>

	var switchDtsCts = function(){
		elsrc = document.getElementById('doclist').src;
		if(elsrc.includes("&textapi=dts")){
			document.getElementById('doclist').src = elsrc.replace("&textapi=dts","")
		}else{
			document.getElementById('doclist').src = elsrc+"&textapi=dts"
		}
	}


	var updateTimeline = function(){
		document.getElementById('docview').src="timeline.html?data=metadatarestrictedperyear.php&sort"
	}

	var updateZipf = function(){
		document.getElementById('docview').src="zipf.html?data=metadatarestricted.php&sort"
	}

	var updatePie = function(){
		document.getElementById('docview').src="piechart.html?data=metadatarestricted.php"
	}
	
	var metadataclick = function(restricted,year){
		params = "&restricted="+restricted
		if((""+year).length>0){
			params += "&year="+year
		}
		document.getElementById('doclist').src="doclist.html?data=metadata.php"+params
	}
	updateTimeline()
	

</script>
