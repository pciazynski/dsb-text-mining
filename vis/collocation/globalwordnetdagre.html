<!doctype html>
<head>
	<meta charset="utf-8">
	<script src="../../lib/cytoscape.min.js"></script>
	<script src="../../lib/dagre.js"></script>
	<script src="../../lib/cytoscape-dagre.min.js"></script>
	<script src="../../_assets/datahandler.js"></script>
	<script src="../../lib/config.js"></script>
</head>

<style>
	#cy {
		width: 100%;
		height: 100%;
		position: absolute;
		top: 0px;
		left: 0px;
	}
</style>

<body>
<div id="cy"></div>

<script>

	nodes = []
	edges = []
	var dataset = getQueryVariable('data')
	var frequency = getQueryVariable('frequency')
	var logdice = getQueryVariable('logdice')
	var left = getQueryVariable('left')
	var right = getQueryVariable('right')
	dataset = dataset +'?left='+left+'&right='+right+'&frequency='+frequency+'&logdice='+logdice
	
	network = readPHP(dataset).split('\n')
	
	if(network.length<10000){lay=getQueryVariable('layout')}else{lay='grid'}
	if(lay.length==0){lay='grid'}

	underscore = "_"

	for (key in network){
		tmp = network[key].split(sep)
		if(tmp.length>=2){
			if(nodes[underscore+tmp[0]] == null){nodes [underscore+tmp[0]] =  2*Math.log(tmp[2])}
			nodes [underscore+tmp[1]] = 2*Math.log(tmp[2])
			edges [underscore+tmp[0]+sep+underscore+tmp[1]] = tmp[3]/25
		}
	}
	var cy = cytoscape({
	container: document.getElementById('cy'),
	style: [{
		selector: "node",
			css: {
				'label': 'data(label)', 
				'text-valign': 'center',
				'text-halign': 'center',
				'text-wrap': 'wrap',
				'height': function(ele){ return 10*Math.max(1,(""+ele.outdegree()).length);},
				'font-size': defNodeFont,
				'width': function(ele){ return 10*Math.max(1,(""+ele.indegree()).length);},
				'background-color': 'red',
				'borderColor':'darkgray',
				'borderWidth':'1'
				}
			},
		{
			selector: "edge",
				css: {
				'curve-style': 'bezier',
				'control-point-step-size': '40',
				'width': 'data(weight)',
				'line-color':'data(color)',
				'target-arrow-shape': 'triangle',
				'target-arrow-color': 'black'
			}
		}
	]});
	
	edgecolor = "black"
	nodecolor = "red"
	
	for (var key in nodes){
		if( key.length>0){
			cy.add({
				data: { id: key,
				color:nodecolor,
				label:key.replace("_","")
			}});
		}
	}

	
	for (var key in edges)
		if( key.length>0){
			tmp = key.split(sep)
			color = edgecolor
			cy.add({
			data: {
				source:tmp[0],
				weight:edges[key],
				target:tmp[1],
				color:color
				}
			});
		}

	cy.layout({
		name: lay,
		minNodeSpacing:1
	}).run();

	var tabbed = null

	cy.on('tap', 'node', function(e){
		if(tabbed!=null){tabbed.style('background-color',defNodeCol)}
		tabbed = e.target
		tabbed.style('background-color','lightblue')
		parent.updateLeftRightNeighbors(tabbed.id().replace(underscore,""));
	});

	var labeltmp = '' 
	cy.on('mouseover', 'node', function(event) {
		node = event.target
		labeltmp = node.style('label')
		node.style('text-background-color','white')
		node.style('text-background-opacity','0.7')
		node.style('label',labeltmp+'\nIn:'+node.indegree()+'\nOut:'+node.outdegree())
	});

	cy.on('mouseout', 'node', function(event) {
		node = event.target
		node.style('label',labeltmp)
		node.style('text-background-opacity','0.0')
		labeltmp = ''
	});

</script>
</body>
