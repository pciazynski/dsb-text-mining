<!DOCTYPE html>
<meta charset="utf-8">
<head>
	<script src="../../lib/plotly-latest.min.js"></script>
	<script src="../../_assets/datahandler.js"></script>
	<script src="../../lib/config.js"></script>
</head>

<body>
<div id="myDiv"><!-- Plotly chart will be drawn inside this DIV --></div>
<script>

	var dataset = getQueryVariable("data")+"?sort"
	var token = getQueryVariable("char")
	var jitter = getQueryVariable("jitter")
	if(jitter.length==0){jitter=defjitter}else{jitter = parseFloat(jitter)}
	if(token.length>0){dataset+="&char="+token}
	data_arr = readPHP(dataset).trim().split("\n");
	maxval = 0
	minval = 10000000

	date= []
	count = []
	hovers = []
	colors = []
	diagramtitle = ""
	tokenarr = token.split(",")
	if (tokenarr.length>1){
		for (var i = 0; i < tokenarr.length; i++){
			diagramtitle += "<span style='color:"+getColor(tokenarr[i])+";'>"+tokenarr[i]+" <span>"
		}
	}else{
		diagramtitle += token
	}
	for (var i = 0; i < data_arr.length; i++) {
		line = data_arr[i];
		if(line.length>1)
		{	
			tmp = line.split(sep)
			value = parseInt(tmp[2])
			jittervalue = value + (jitter*(Math.random()))
			date.push(tmp[1])
			count.push(jittervalue)
			hovers.push(tmp[1]+":"+tmp[0]+" "+value)
			colors.push(getColor(tmp[0]))
			if (jittervalue<minval ){minval = jittervalue}
			if (jittervalue>maxval ) {maxval = jittervalue}
		}
	}
	if (getQueryVariable("scale")==="log"){minval = Math.log(1);maxval=Math.log(maxval)}else{minval=0;maxval=maxval+(maxval/10)+1}
	var data = [{
		x: date,
		y: count,
		name: 'Token Count',
		hovertemplate: '%{text}',
		type: 'scatter',
		mode: "markers",
		text:hovers,
		marker: {
			size:markersize(data_arr.length),
			color: colors,
			opaciy:0.2
		}
	}];

	var layout = {
		hovermode:"closest",
		title:{
			text:diagramtitle,
			font:diagramfont
		},
		xaxis: {
			automargin: true,
			range:[minDate-2,maxDate+2],
			linewidth: 1,
			title: {
				font:diagramfont
			},
			tickangle:90,
			tickfont:diagramfont
		},
		yaxis: {
			type:scale,
			range:[0,maxval+maxval/10],
			title: {
				text: 'Häufigkeit (Abs)',
				font:diagramfont
			}
		},
		annotations: watermarke()
	};

	myPlot = Plotly.newPlot('myDiv', data, layout, plotlyconfiguration);

</script>
</body>
