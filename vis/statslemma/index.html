<div class = "explain">
	<p>
		Die Lemmata sind hier wahlweise nach Häufigkeitsrang oder Menge der zugehörigen Types aufgelistet. Ein Klick auf einen Balken fügt das Lemma unten ein.
	</p>
</div>


<table class="optionmenu" align="center">
	<tr>
		<td style="text-align:right;"><script>document.write(lang_frequency)</script></td>
		<td>
			<input type="number" value="1000" id="min" onchange="updateZipf()">
		</td>
	</tr>
	<tr>
		<td style="text-align:right;"><script>document.write(lang_sorting)</script></td>
		<td>
			<button onclick ="updateZipf()"><script>document.write(lang_frequency)</script></button>
			<button onclick ="zipfTypecount()"><script>document.write(lang_typecount)</script></button>
		</td>
	</tr>

		<td style="text-align:right;vertical-align:top;"><script>document.write(lang_redirect)</script><br/></td>

			<span id="profilelink"></span><br/>
		</td>
	</tr>
</table>

<div class = "iframediv">
	<button class = "iframebutton" onclick="embedding('zipf');"><script>document.write(lang_htmlembedding)</script></button>
	<button class = "iframebutton" onclick="diagrammlink('zipf');"><script>document.write(lang_fullscreen)</script></button>
	<button class = "iframebutton" onclick="datalink('zipf');"><script>document.write(lang_rawdata)</script></button>
	<div style="text-align:center;">
		<iframe class="resized"  width="100%" height="475px" id="zipf" scrolling="yes"></iframe>
	</div>
	<button class = "iframebutton" onclick="threeD('zipf');"><script>document.write(lang_freq_or_wordlengthfreq)</script></button>
	<button class = "iframebutton" onclick="switchLogScale('zipf');"><script>document.write(lang_switchlogscale)</script></button>
	<button class = "iframebutton" onclick="hidewatermark('zipf');"><script>document.write(lang_source)</script></button>
</div>
<br><br>
<script>
	var zipfClick = function(tmp){
		document.getElementById("timelinelink").innerHTML = '<a target="_blank" href="../bwlemma?lemma='+tmp+'">'+lang_timeline+'</a> '+tmp;
		document.getElementById("profilelink").innerHTML = '<a target="_blank" href="../profile?lemma='+tmp+'">'+lang_profile+'</a> ';
	}
	
	
	var zipfTypecount = function(){
		loading("zipf")
		document.getElementById("zipf").src="zipf.html?data=typecountperlemma.php&sort=1"
	}
	
	var updateYearlabel = function(){
		tmp = parseInt(document.getElementById("yearminslider").value)
		document.getElementById("yearlabel").innerHTML = tmp
	}
	
	var callDolnoserbski = function(){
		curlemma = document.getElementById("lemma").value.trim()
		if(curlemma.length>0){
			window.open("https://dolnoserbski.de/ortografija/slownik?wuraz="+curlemma, "_blank")
		}
	}
	
	var callLemmatree = function(){
		curlemma = document.getElementById("lemma").value.trim()
		if(curlemma.length>0){
			window.open("../lemmavariation?lemma="+curlemma, "_blank")
		}
	}
	
	var updateZipf = function(){
		loading("zipf")
		tmp = document.getElementById("min").value.trim()
		document.getElementById("zipf").src="zipf.html?data=lemmamapping/_lemmabag&min="+tmp
	}
		
	updateZipf()
	document.title=lang_lemmafy+" "+lang_statistics

</script>
<br><br>
<script>
	document.write(footer())
</script>
</body>
