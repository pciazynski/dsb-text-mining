<!DOCTYPE html>
<meta charset="utf-8">
<head>
	<script src="../../lib/plotly-latest.min.js"></script>
	<script src="../../_assets/datahandler.js"></script>
	<script src="../../lib/config.js"></script>
</head>

<body>
<div id="myDiv"><!-- Plotly chart will be drawn inside this DIV --></div>
<script>

	var dataset = getQueryVariable("data")
	data_arr = readTextFile(dataset).split("\n");
	maxval = 0
	minval = 10000000
	

	
	if(dataset.includes("_minmaxyearmax")){
		diagramtitle = "Worttot"
		row = 1
	}else{
		diagramtitle = "Wortgenese"
		row = 0
	}
	date= []
	count = []
	hovers = []
	yearcount = []
	
	delim = ","
	var labels= []

	function addLabel(key,str){
		if(labels[key] !=null){
			labels[key]=(labels[key]+delim+str)
		} else {
			labels[key]=str
		}
	}
	
	for (var i = 0; i < data_arr.length; i++) {
		line = data_arr[i];
		if(line.length>1)
		{	
			tmp = line.split(sep)
			year = tmp[row]
			addLabel(year,tmp[2])
			if(yearcount[year] != null){
				yearcount[year] = yearcount[year] + tmp[2].split(",").length
			}else{
				yearcount[year] = tmp[2].split(",").length
			}
		}
	}

	
	for (key in yearcount){
		date.push(key)
		count.push(yearcount[key])
		if (yearcount[key]<minval ){minval = yearcount[key]}
		if (yearcount[key]>maxval ) {maxval = yearcount[key]}
	}

	var data = [{
		x: date,
		y: count,
		type: 'line',
		marker: {
			color: "black"
		}
	}];

	if (getQueryVariable("scale")==="log"){minval = Math.log(1);maxval=Math.log(maxval)}else{minval=0;maxval=maxval+(maxval/10)+1}
	var layout = {
		hovermode:"closest",
		title:{
			text:diagramtitle,
			font:diagramfont
		},
		xaxis: {
			automargin: true,
			range:[minDate-2,maxDate+2],
			linewidth: 1,
			title: {
				font:diagramfont
			},
			tickangle:90,
			tickfont:diagramfont
		},
		yaxis: {
			type:scale,
			range: [minval, maxval],
			title: {
				text: 'Anzahl pro Jahr',
				font:diagramfont
			}
		},
		annotations: watermarke()
	};

	myPlot = Plotly.newPlot('myDiv', data, layout, plotlyconfiguration);
	var myPlot = document.getElementById('myDiv')
	myPlot.on('plotly_click', function(data){
		if(dataset.includes("_minmaxyearmin")){alert("Wortgenese "+data.points[0].x+":\n"+labels[data.points[0].x]);}
		if(dataset.includes("_minmaxyearmax")){alert("Worttod "+data.points[0].x+":\n"+labels[data.points[0].x]);}
	})
	
	document.title=diagramtitle
</script>
</body>
