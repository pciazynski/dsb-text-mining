<!DOCTYPE html>
<meta charset="utf-8">
<head>
	<script src="../../lib/plotly-latest.min.js"></script>
	<script src="../../_assets/datahandler.js"></script>
	<script src="../../lib/config.js"></script>
	<link rel="stylesheet" href="../../styles.css">
</head>

<body>
<div id="myDiv"><!-- Plotly chart will be drawn inside this DIV --></div>

<script>

	var dataset = getQueryVariable("data")
	if (getQueryVariable("sort")==1){dataset+="?sort"}
	var max = getQueryVariable("max")
	var min = getQueryVariable("min")
	var norm = "|"+getQueryVariable("norm")+"|"
	var limit = getQueryVariable("limit")
	if(dataset.includes(".php")){
		data_arr = readPHP(dataset).split("\n");
		diagramtitle = "Menge der Types"
	}
	else{
		data_arr = readTextFile(dataset).split("\n");
		diagramtitle = "Normierung Häufigkeiten"
	}
	allText=""
	maxval = 0

	if(limit.length==0){limit=data_arr.length}
	limit=parseInt(limit)
	if(limit>data_arr.length){limit=data_arr.length}

	date= []
	count = []
	colors = []
	add = true
	if(norm.length>2){
		add = false
	}
	for (var i = 0; i < limit; i++){
		line = data_arr[i];
		if(line.length>1){
			tmp = line.split(sep)
			if(norm.length>2 && !add){
				limit = Math.min(limit+1,data_arr.length)
				if(tmp[0]===norm){
					add = true
				}
			}
			if(tmp[0] === "||"){continue;}
			if (!add){continue}
			value  = parseInt(tmp[1])
			if(max.length>0 & value > parseInt(max)){continue}
			if(min.length>0 & value < parseInt(min)){continue}
			date.push(tmp[0].substring(1,tmp[0].length-1))
			count.push(value)
			colors.push(getColor(tmp[0], false))
			if (value>maxval ) {maxval = value}
		}
	}

	var data = [{
		x: date,
		y: count,
		type: 'bar',
		marker: {
			color: colors
		}
	}];

	if (getQueryVariable("scale")==="log"){minval = Math.log(1);maxval=Math.log(maxval)}else{minval=0;maxval=maxval+(maxval/10)+1}
	var layout = {
		barmode: 'stack',
		title:diagramtitle,
		hovermode:'x',
		xaxis: {
			automargin: true,
			linewidth: 1,
			title: {
				font: diagramfont
			},
			tickangle:90,
			tickfont:diagramfont,
			showticklabels:false
			},
		yaxis: {
			type:scale,
			range: [minval, maxval],
			title: {
				text: 'Häufigkeit (Abs)',
				font: diagramfont
				}
			},
		annotations: watermarke()
	};

	myPlot = Plotly.newPlot('myDiv', data, layout, plotlyconfiguration);
	myPlot = document.getElementById('myDiv')
	myPlot.on("plotly_click", function(data) {
		parent.zipfClick(data.points[0].x)
	});
	document.title = diagramtitle

</script>
</body>
