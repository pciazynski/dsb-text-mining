<script>

	var switchPrefixsearch = function(){
		tmp = document.getElementById('prefixsearchCheckBox').checked
		if(tmp){tmp = 'alphabet'}else{tmp = 'frequency'}
		autocomplete("wordinput", "prefixsearch.php?limit=30&sortby="+tmp+"&word=", ""); 
	}

	var threeD = function(iframeid){
		loading(iframeid)
		el = document.getElementById(iframeid)
		if(el.src.includes("3d.html")){
			el.src=el.src.replace("3d.html",".html")
		}else{
			el.src=el.src.replace(".html","3d.html")
		}
	}
	
	
	var linreg = function(iframeid){
		loading(iframeid)
		tmp = document.getElementById("wordinput").value.trim()
		if(tmp.length>0){
			if(document.getElementById(iframeid).src.includes("timeline.html")){
				document.getElementById(iframeid).src="linreg_chart.html?data=tokencountperyear.php&token="+tmp+"&sort"
			}else{
				document.getElementById(iframeid).src="timeline.html?data=tokencountperyear.php&token="+tmp+"&sort"
			}
		}
	}

	var updateTimelineRegex = function(){
		loading("timeline")
		tmp = document.getElementById("regexsearch").value.trim()
		if(tmp.length>0){
			document.getElementById("timeline").src="timeline.html?data=regexsearch.php&token="+tmp+"&sort"
		}
		document.getElementById('switchlinreg').disabled = true;
	}


	var callDolnoserbski = function(){
		tmp = document.getElementById("wordinput").value.trim()
		if(tmp.length>0){
			window.open("https://dolnoserbski.de/ortografija/slownik?wuraz="+tmp, "_blank")
		}
	}

	var switchpercenttimeline  = function(elid){
		tmp = document.getElementById(elid)
		url = tmp.src.replaceAll("sum.html",".html").replaceAll('linreg_chart','timeline')
		if(url.includes("percenttimeline")){
			tmp.src = url.replace("percenttimeline","timeline")
		}else{
			tmp.src = url.replace("timeline","percenttimeline")
		}
	}

	var addWordToList = function(){
		tmp = document.getElementById("wordinput").value.trim()
		tmp2 = document.getElementById("wordlist").value.trim()
		str = ""
		if(tmp.length>0){
			if(tmp2.length>0){str = ","}
			str = tmp2+str+tmp
			document.getElementById("wordlist").value = str
			updateTimelineWordList()
		}
	}

	var updateTimelineWordList = function(){
		loading("timeline")
		tmp = document.getElementById("wordlist").value.trim()
		if(tmp.length>0){
			document.getElementById("timeline").src="timeline.html?data=tokencountperyear.php&token="+tmp+"&sort"
		}
		document.getElementById('switchlinreg').disabled = true;
	}

	var updateTimeline = function(){
		tmp = document.getElementById("wordinput").value.trim()
		if(tmp.length>0){
			loading("timeline")
			loading("wordinfo")
			document.getElementById("timeline").src="timeline.html?data=tokencountperyear.php&token="+tmp+"&sort"
			document.getElementById("wordinfo").src="wordinfo.html?data=token2lemma.php&token="+tmp
			document.title="Word "+tmp
			document.getElementById('switchlinreg').disabled = false;
		}
	}
		
	curword = getQueryVariable('word')
	if(curword.length>0){
		document.getElementById('wordinput').value=curword
		updateTimeline()
		document.getElementById("wordinfo").scrollIntoView()
	}
	else{
		document.getElementById('wordinfo').src="error_token.html"
		document.getElementById('timeline').src="error_token.html"
	}
	

	document.title="Wort "+curword

</script>
