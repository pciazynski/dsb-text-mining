<!doctype html>
<html>
<head>
	<meta charset="utf-8">
	<script src="../../_assets/datahandler.js"></script>
	<script src="../../lib/config.js"></script>
	<link rel="stylesheet" href="../../digilabstyles.css">
</head>

<body style="text-align:left;">
	<audio id="audioplayer">
		Your browser does not support the audio element.
</audio> 

<script>
	var dataset = getQueryVariable("data")
	var word = getQueryVariable("token")
	dataset = dataset +"?token="+word
	data_arr = readPHP(dataset).split("\n");

	str = '<table class="clicktable">';
	str = str + '<tr><th>Dokument-<br>nachweise</th><th>Lemma</th><th>Deutsch<br>(dolnoserbski.de)<br></th><th>Vorlesen<br>(dolnoserbski.de)</th><th>Word</th><th>Norm</th><th>Type</th><th>Subtype</th>'
	str = str +"</tr>"

	

	for (var i = 0; i < data_arr.length; i++) {
		arr = data_arr[i].split(sep)
		str += '<tr>'
		str += "<td><a target='_blank' href=../docreferences/?word="+word+">&#10149;</a></td>"
		lemma = arr[0].slice(1,-1)
		if(lemma.length>0){
			str += "<td><a target='_blank' href=../bwlemma/?lemma="+lemma+">"+lemma+"</a></td>"
			str += "<td><a target='_blank' href=https://dolnoserbski.de/ndw/pytanje?wuraz="+lemma.split("|")[0]+"&slownik=*&psistup=serbski&pisanje=originalne&pozicija=slowo>&#10149;</a></td>"
		}else{str += "<td></td><td></td>"}
		if(arr.length>2){
			normtoken = ""
			normtoken = arr[2].slice(1,-1).replaceAll("|",",").toLowerCase()
			if(normtoken.length==0){
			}
		}
		else{normtoken = word}
		
		readword = readPHP("psedcytassearch.php?word="+normtoken).trim()
		if(readword.length==0){readword = readPHP("psedcytassearch.php?word="+word).trim()}
		if(readword.length > 0){
			leseurl="https://dolnoserbski.de/dnw/audio/"+readword
			onclickfun = "document.getElementById('audioplayer').src='"+leseurl+"';document.getElementById('audioplayer').play()"
			str += '<td onclick="'+onclickfun+'"> &#128266; </td>'
		}
		else{
			str += '<td></td>'
		}
		
		str += "<td><a target='_blank' href=../bwword/?word="+word+">"+word+"</a></td>"

		for (var j=2;j<arr.length;j++){
			str += "<td>"+arr[j]+"</td>"
		}

		str += '</tr>'
	}

	str = str + "</table>";
	document.write(str)
	data_arr = ""
	str = ""
</script>
</body>
