<script>
	yearminslider.oninput = function() {
		otherslider=document.getElementById("yearmaxslider")
		otherslider.value=Math.max(otherslider.value,this.value)
		yearminvalue.innerHTML = this.value
		yearmaxvalue.innerHTML = otherslider.value
	}

	yearmaxslider.oninput = function() {
		otherslider=document.getElementById("yearminslider")
		otherslider.value=Math.min(otherslider.value,this.value)
		yearminvalue.innerHTML = otherslider.value
		yearmaxvalue.innerHTML = this.value
	}
	yearminslider.min=minDate

	
	yearmaxslider.min = minDate
	yearmaxslider.max = maxDate
	yearminslider.min = minDate
	yearminslider.max = maxDate
	yearminslider.value = minDate
	yearmaxslider.value = maxDate
	yearminvalue.innerHTML=minDate
	yearmaxvalue.innerHTML = maxDate
</script>

<script>

	var switchDtsCts = function(){
		elsrc = document.getElementById('doclist').src;
		if(elsrc.includes("&textapi=dts")){
			document.getElementById('doclist').src = elsrc.replace("&textapi=dts","")
		}else{
			document.getElementById('doclist').src = elsrc+"&textapi=dts"
		}
	}
	var switchPrefixsearch = function(){
		tmp = document.getElementById('prefixsearchCheckBox').checked
		if(tmp){tmp = 'alphabet'}else{tmp = 'frequency'}
		autocomplete("word", "prefixsearch.php?limit=30&sortby="+tmp+"&word=", ""); 
		autocomplete("lemma", "prefixlemmasearch.php?limit=30&sortby="+tmp+"&lemma=", ""); 
		autocomplete("norm", "prefixnormsearch.php?limit=30&sortby="+tmp+"&norm=", "");
	}

	var updateTimeframe = function(){
		yearval = ""
		yearmin = document.getElementById("yearminslider").value
		yearmax = document.getElementById("yearmaxslider").value
		if(yearmin > minDate || yearmax < maxDate){
			yearval = "&year=BETWEEN "+yearmin + " AND "+yearmax
		}
		document.getElementById('doclist').src = document.getElementById('doclist').src.split("&year=")[0]+yearval
		document.getElementById('timeline').src = document.getElementById('timeline').src.split("&year=")[0]+yearval
	}
	
	var callDolnoserbski = function(){
		tmp = document.getElementById('token').value.trim()
		if(tmp.length>0){
			window.open('https://dolnoserbski.de/ortografija/slownik?wuraz='+tmp, '_blank')
		}
	}
	
	var updateWord = function(){
		tmp = document.getElementById('word').value.trim()
		if(tmp.length>0){
			loading('timeline')
			loading('doclist')
			document.getElementById('doclist').src = 'doclist.html?data=urnbyword.php&word='+tmp+yearval
			document.getElementById('timeline').src = 'timeline.html?data=urnbyword.php&word='+tmp+yearval
			document.title=tmp+" Dok.nachweise "
		}
	}
	
	var updateNorm = function(){
		tmp = document.getElementById('norm').value.trim()
		if(tmp.length>0){
			loading('timeline')
			loading('doclist')
			document.getElementById('doclist').src = 'doclistnorm.html?data=urnbynorm.php&norm='+tmp+yearval
			document.getElementById('timeline').src = 'timeline.html?data=urnbynorm.php&norm='+tmp+yearval
			document.title=tmp+" Dok.nachweise "
		}
	}

	var updateLemma = function(){
		tmp = document.getElementById('lemma').value.trim()
		if(tmp.length>0){
			loading('timeline')
			loading('doclist')
			document.getElementById('doclist').src = 'doclistlemma.html?data=urnbylemma.php&lemma='+tmp+yearval
			document.getElementById('timeline').src = 'timeline.html?data=urnbylemma.php&lemma='+tmp+yearval
			document.title=tmp+" Dok.nachweise "
		}
	}
	
	document.title="Dok.nachweise"
	yearval = getQueryVariable('year')
	if(yearval.length>0){yearval = "&year="+yearval}
	tmplemma = getQueryVariable('lemma')
	tmpnorm = getQueryVariable('norm')
	if(tmplemma.length>0){
		document.getElementById('lemma').value = tmplemma
		updateLemma()
	}
	else{
		if(tmpnorm.length>0){
			document.getElementById('norm').value = tmpnorm
			updateNorm()
		}
		else{
			document.getElementById('word').value = getQueryVariable('word')
			updateWord()
		}
	}

</script>
