<body style="background-color:white">

<script>

	lemma = getQueryVariable('lemma')
	clickable = getQueryVariable('clickable')
	if(lemma.length>0){
		today = new Date();
		dd = String(today.getDate()).padStart(2, '0');
		mm = String(today.getMonth() + 1).padStart(2, '0'); //January is 0!
		yyyy = today.getFullYear();
		today = dd + '.' + mm + '.' + yyyy;
		data = readPHP("lemmaprofile.php?lemma="+lemma).split("\n")
		if(data.length>1){
			data[5] = ""
			if(data[4] != null){
				tmparr = data[4].split("\t")
				tmparrseen = data[3].split("\t")
				for (var i = 0;i<tmparr.length;i++){
					if(!data[3].includes(tmparr[i]))
					data[5]+=tmparr[i]+"\t"
				}
				data[5] = data[5].trim()
			}

			if (clickable == 1){

					tmparr = data[2].split("\t")

					for (key in tmparr){
						token_count=tmparr[key].split(":")
						data[2] += '<a href="lemmaprofile.html?lemma='+token_count[0]+'&clickable=1">'+tmparr[key]+'</a>\t'

					data[2] = data[2].trim()
				}
				if(data[3] != null){
					tmparr = data[3].split("\t")
					data[3] = ""

						token_count=tmparr[key].split(":")
						data[3] += '<a href="wordprofile.html?word='+token_count[0]+'&clickable=1">'+tmparr[key]+'</a>\t'
					}
					data[3] = data[3].trim()
				}
				if(data[4] != null){

					data[4] = ""
					for (key in tmparr){
						token_count=tmparr[key].split(":")
						data[4] += '<a href="wordprofile.html?word='+token_count[0]+'&clickable=1">'+tmparr[key]+'</a>\t'
					}
					data[4] = data[4].trim()
				}
				if(data[5] != null){
					tmparr = data[5].split("\t")
					data[5] = ""
					for (key in tmparr){
						token_count=tmparr[key].split(":")
						data[5] += '<a href="wordprofile.html?word='+token_count[0]+'&clickable=1">'+tmparr[key]+'</a>\t'

			infotext+='<tr><td>Häufigkeit</td>'

			infotext+='<td> '+data[0].split("\t")[0]+'</td></tr>'
			infotext+='<tr style="background-color:#F0F3FA;"><td>Rang</td>'

			infotext+='<td> '+data[0].split("\t")[1]+'</td></tr>'

			infotext+='<tr style="background-color:#F0F3FA;"><td>Letzter&nbsp;Beleg</td>'

			infotext+='<td> '+data[2]+'</td></tr>'
			infotext+='<tr style="background-color:#F0F3FA;"><td>Belegte&nbsp;Wortformen nicht ambig</td>'

			infotext+='<td> '+data[5]+'</td></tr>'
			infotext+='<tr style="background-color:#F0F3FA;"><td>Belegte&nbsp;Wortformen&nbsp;inkl&nbsp;ambig</td>'
			if(clickable==1){infotext+='<td><a target="_blank" href = "../../vis/bwlemma/traviz.html?data=lemmatoken.php&sort&focus=0&lemma='+lemma+'">❧</a>&nbsp;<a target="_blank" href = "../../php/lemmatoken.php?sort&focus=0&lemma='+lemma+'">➚</a></td>'}
			infotext+='<td> '+data[4]+'</td></tr>'
			
			
			infotext=infotext.replaceAll("\t",", ")
			if (clickable == 1){
				infotext += '<tr><td></td><td></td><td>'+wm_title+'</td></tr></table>'
			}
			else{
				infotext += '<tr><td></td><td>'+wm_title+'</td></tr></table>'
			}
			clicktext = '<table align=center style="valign:top;border-collapse: collapse;"><tr>'
			if(clickable==1){clicktext += '<td><a href="?lemma='+lemma+'">Interaktionselemente entfernen</a></td>'}

			clicktext+='</tr></table>'
		
			document.write('<h1 style="text-align:center;">Lemmaprofil '+lemma+'</h1><p style="text-align:center;">Die Vollständigkeit der Daten entspricht dem Bearbeitungsstand des Textkorpus.</p>'+clicktext+infotext)
		}
		else{
			document.write('<table align=center style="valign:top;border-collapse: collapse;"><tr><td>Lemma existiert <a target="_blank" href="../bwlemma/?headerconf='+getQueryVariable('headerconf')+'&lemma='+lemma+'">nur ambig</a> oder ein Fehler ist passiert.</td></tr></table>')
		}
	}
</script>
