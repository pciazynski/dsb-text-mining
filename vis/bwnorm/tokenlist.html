<!doctype html>
<html>
<head>
	<meta charset="utf-8">
	<script src="../../lib/plotly-latest.min.js"></script>
	<script src="../../_assets/datahandler.js"></script>
	<script src="../../lib/config.js"></script>
	<link rel="stylesheet" href="../../styles.css">
</head>

<body style="text-align:left;">
<script>
	var dataset = getQueryVariable("data")
	var norm = getQueryVariable("norm")
	var exact = getQueryVariable("exact")
	dataset = dataset +"?norm="+norm+"&sort"
	if (exact.length>0){title=norm;dataset+="&exact=1"}else{title="..|"+norm+"|..";}
	data_arr = readPHP(dataset).trim().split("\n");


	str = "<table style='border-collapse: collapse;text-align:left;'>";
	str = str + "<tr><th style='border: 2px solid black;padding:5px 5px 5px 5px;'>Tokenliste<br>"+title+"</th><th style='border: 2px solid black;padding:5px 5px 5px 5px;'>Anzahl Textvorkommen</th>"
	str = str +"</tr>"

	for (var i = 0; i < data_arr.length; i++) {
		arr = data_arr[i].split(sep)
		resstr='<span style="color:'+getColor(arr[1])+';">▮</span>'+arr[1]+'</span><a target="_blank" href="../bwtoken?token='+arr[1]+'">&#10149;</a>'
		str = str + "<tr><td style='border: 2px solid black;padding:5px 5px 5px 5px;'>"+resstr+"</td><td style='border: 2px solid black;padding:5px 5px 5px 5px;'>"+arr[2]+"</td>"
		str = str +'</tr>'
	}

	str = str + "</table>";
	document.write(str)
	data_arr = ""
	str = ""
	document.title = "Tokenliste "+ title

</script>
</body>
