<!doctype html>
<html>
<head>
	<meta charset="utf-8">
	<script src="../../lib/def_language.js"></script>
	<script src="../../lib/my_language.js"></script>
	<script src="../../_assets/datahandler.js"></script>
	<script src="../../lib/config.js"></script>
</head>

<body style="text-align:left;">
<script>
	var dataset = getQueryVariable('data')
	var token = getQueryVariable('token')
	dataset = dataset +'?token='+token
	data_arr = readPHP(dataset).split("\n");

	str = '<table style="border-collapse: collapse;text-align:left;">';
	str += '<tr><th style="border: 2px solid black;padding:5px 5px 5px 5px;">'+lang_normify+'</th><th style="border: 2px solid black;padding:5px 5px 5px 5px;">Deutsch (dolnoserbski.de)</th><th style="border: 2px solid black;padding:5px 5px 5px 5px;">'+lang_word+'</th>'
	str += '</tr>'

	for (var i = 0; i < data_arr.length; i++) {
		if(data_arr[i].trim().length>0){
			arr = data_arr[i].split(sep)
			str = str + '<tr>'
			str = str + '<td style="border: 2px solid black;padding:5px 5px 5px 5px;"><a target="_blank" href="../bwnorm/?norm='+arr[1]+'">'+arr[1]+'</a></td>'
			str = str + '<td style="border: 2px solid black;padding:5px 5px 5px 5px;"><a target="_blank" href="https://dolnoserbski.de/ndw/pytanje?wuraz='+arr[1].slice(1,-1).split('|')[0]+'&slownik=*&psistup=serbski&pisanje=originalne&pozicija=slowo">'+arr[1].slice(1,-1).split('|')[0]+'</a></td>'
			str = str + '<td style="border: 2px solid black;padding:5px 5px 5px 5px;"><a target="_blank" href="../bwword/?word="'+arr[0]+'">'+arr[0]+'</a></td>'
			str = str +'</tr>'
		}
	}

	str = str + '</table>';
	document.write(str)
	data_arr = ''
	str = ''
</script>
</body>
