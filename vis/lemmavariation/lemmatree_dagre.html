<!doctype html>
<head>
	<meta charset="utf-8">
	<script src="../../lib/cytoscape.min.js"></script>
	<script src="../../lib/dagre.js"></script>
	<script src="../../lib/cytoscape-dagre.min.js"></script>
	<script src="../../_assets/datahandler.js"></script>
	<script src="../../lib/config.js"></script>
</head>

<style>
	#cy {
		width: 100%;
		height: 100%;
		position: absolute;
		top: 0px;
		left: 0px;
	}
</style>

<body>
<div id="cy"></div>

<script>


	nodes = []
	edges = []
	var dataset = getQueryVariable('data')
	var lemma = getQueryVariable('lemma')
	dataset = dataset +'?lemma='+lemma
	if (getQueryVariable("inclusive").length>0){dataset+="&inclusive"}
	if (getQueryVariable("weight").length>0){weight=true}else{weight=false}
	
	if (getQueryVariable("inclusive").length>0 || lemma.includes(',') || dataset.includes('regex.php')){rootel=true}else{rootel=false}
	network = readPHP(dataset).split('\n')
	lay='dagre'
	if(rootel){nodes[lemma] = 0}
	for (key in network){
		tmp = network[key].split(sep)
		if(tmp.length>=2){
			if(nodes[tmp[0]] == null){
				nodes [tmp[0]] =  0
				if(rootel){edges[lemma+sep+tmp[0]] = 1}
			}
			nodes [tmp[1]] = tmp[2]
			edges [tmp[0]+sep+tmp[1]] = 1
			nodes [tmp[0]] = nodes [tmp[0]] + parseInt(tmp[2])
			if(rootel){nodes [lemma] = nodes [lemma] + parseInt(tmp[2])}
		}
	}
	
	var cy = cytoscape({
	container: document.getElementById('cy'),
	style: [{
		selector: 'node',
		css: {
			'label': 'data(id)', 
			'text-valign': 'center',
			'text-halign': 'center',
			'text-wrap': 'wrap',
			'height': 'data(height)',
			'font-size': defNodeFont,
			'width': 'data(width)',
			'background-color': 'data(color)',
			'borderColor':'darkgray',
			'borderWidth':'1',
			'shape': 'circle'
			}
		},
		{
		selector: 'node.highlight',
		style: {
			'label': 'data(id)',
			'text-valign': 'center',
			'color':'white',
			'text-outline-color': 'red',
			'text-outline-width': 2
			}
		},
		{
			selector: "edge",
			css: {
			'curve-style': 'bezier',
			'control-point-step-size': '40',
			'width': '1',
			'line-color':'gray',
			'target-arrow-shape': 'triangle',
			'target-arrow-color': 'black'
		}
	}]});

	for (var key in nodes){
		if( key.length>0)
		{
			if(weight){size = Math.min(100,Math.log(parseInt(nodes[key]))+10)}else{size=19}
			if(key==lemma){color = 'gray'}else{color='red'}
			cy.add({
				data: { id: key,
				color:getColor(key),
				width:size,
				height:size
			}});
		}
	}

	for (var key in edges)  
		if( key.length>0)
		{
			tmp = key.split(sep)
			cy.add({
			data: {
				source:tmp[0],
				weight:1,
				target:tmp[1],
				}
			});
		}

	cy.layout({
		name: lay,
		minNodeSpacing:1
	}).run();

	var labeltmp = '' 
	cy.on('mouseover', 'node', function(event) {
		node = event.target
		labeltmp = node.style('label')
		node.style('text-background-color','white')
		node.style('text-background-opacity','0.9')
		node.style('label',labeltmp+':'+nodes[labeltmp])
	});

	cy.on('mouseout', 'node', function(event) {
		node = event.target
		node.style('label',labeltmp)
		node.style('text-background-opacity','0.0')
		labeltmp = ''
	});
	
	var tappedBefore;
	var tappedTimeout;
	cy.on('tap', function(event) {
		var tappedNow = event.target;
		if (tappedTimeout && tappedBefore) {
			clearTimeout(tappedTimeout);
		}
		if(tappedBefore === tappedNow) {
			tappedBefore = null;
			cy.fit()
		}else{
				tappedTimeout = setTimeout(function(){ tappedBefore = null; }, 300);
				tappedBefore = tappedNow;
				if (tappedNow!==cy){
					cy.fit(event.target.neighborhood(),100)
					if(!event.target.id().includes("Input:")){
						elemen = event.target.id()
						if(elemen.includes("|")){parent.lemmaclick(elemen.slice(1,-1))}
						else{parent.tokenclick(elemen)}
					}
				}
			}});
	

</script>
</body>
