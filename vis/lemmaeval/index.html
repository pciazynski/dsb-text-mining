<script>
	var updateZipf = function(){
		loading("progresszipf")
		document.getElementById("progresszipf").src="zeroonezipf.html?data=lemmamapping/_progress&scale=log&min="+document.getElementById("zipffrequency").value
	}

	var diatype = function(id, diatype){
		loading(id)
		srctmp = document.getElementById(id).src = diatype+".html"+document.getElementById(id).src.split(".html")[1]
	}

	var updateFocus = function(newfocus){
		if(curlemma.length>0){
			loading("timeline")
			focus = newfocus
			sourcearr = document.getElementById("timeline").src.split("&focus=")
			source = sourcearr[0]+sourcearr[1].slice(1)+"&focus="+focus
			if(focus==3){
				document.getElementById("focusbutton0").style.boxShadow  = "none"
				document.getElementById("focusbutton3").style.boxShadow  = "-7px 0px 3px 6px white"
				source = source.replace("lemmasumperyear","lemmacountperyear")}
			else{
				document.getElementById("focusbutton3").style.boxShadow  = "none"
				document.getElementById("focusbutton0").style.boxShadow  = "7px 0px 3px 6px white"
				source = source.replace("lemmacountperyear","lemmasumperyear")
			}
			document.getElementById("timeline").src=source
			document.title="Lemma "+curlemma
		}
	}
	
	var updatezeroone = function(){
		loading("zeroone")
		loading("piebox")
		loading("stats")
		document.getElementById("zeroone").src="zeroone.html?data=lemmamapping/_lemmauniqueness"
		document.getElementById("piebox").src="piechart.html?data=lemmamapping/_lemmauniqueness"
		document.getElementById("stats").src="basics.html?data=lemmamapping/_lemmauniqueness"
	}
	
	var lemmaClick = function(lemma){
		if(focus==3){funcall = "lemmacountperyear"}else{funcall="lemmasumperyear"}
		if(lemma.length>0){
			document.getElementById("timeline").src="timeline.html?data="+funcall+".php&lemma="+lemma+"&sort&exact=1&focus="+focus
			document.getElementById("tokengroup").src="tokenlist.html?data=lemmatoken.php&lemma="+lemma+"&sort&exact=1"
		}
	}
	
	var pointClick = function(lemma, hover){
		document.getElementById("lemmatext").innerHTML = hover
		document.getElementById("lemma").value = lemma
		updateTimeline()
	}
	
	var callDolnoserbski = function(){
		curlemma = document.getElementById("lemma").value.trim()
		if(curlemma.length>0){
			window.open("https://dolnoserbski.de/ortografija/slownik?wuraz="+curlemma, "_blank")
		}
	}
	
	var callLemmatree = function(){
		curlemma = document.getElementById("lemma").value.trim()
		if(curlemma.length>0){
			window.open("../lemmavariation?lemma="+curlemma, "_blank")
		}
	}
	
	var updateTimeline = function(){
		loading("timeline")
		loading("lemmagroup")
		loading("tokengroup")
		curlemma = document.getElementById("lemma").value.trim()
		if(focus==3){funcall = "lemmacountperyear"}else{funcall="lemmasumperyear"}
		if(curlemma.length>0){
			document.getElementById("timeline").src="timeline.html?data="+funcall+".php&lemma="+curlemma+"&sort&focus="+focus
			document.getElementById("lemmagroup").src="lemmalist.html?data=lemmagroup.php&lemma="+curlemma+"&sort"
			document.getElementById("tokengroup").src="tokenlist.html?data=lemmatoken.php&lemma="+curlemma+"&sort"
		}
		document.title="Lemma "+curlemma
	}

	var focus = 0
	var curlemma = getQueryVariable("lemma")
	document.getElementById("focusbutton0").style.boxShadow  = "7px 0px 3px 6px white"
	updateZipf()
	updatezeroone()

	document.title="Lemma Evaluation"

</script>
