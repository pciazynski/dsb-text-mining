<!DOCTYPE html>
<meta charset="utf-8">
<head>
	<script src="../../_assets/datahandler.js"></script>
	<script src="../../lib/config.js"></script>
	<script src="calc.js"></script>
	<link rel="stylesheet" href="../../digilabstyles.css">
</head>
<body>
<script>

	var dataset = decodeURIComponent(getQueryVariable("data"))
	data_arr = readTextFile(dataset).split("\n")
	N = []
	
	for (var i = 0; i < data_arr.length; i++) {
		if((data_arr[i]).trim().length > 0 ){
			value = parseFloat(data_arr[i].split("\t")[1])
			N.push(value)
		}
	}
	sum = 0
	max = -100000000
	min = 100000000

	for (var i = 0; i < N.length; i++) {
		val = parseFloat(N[i])
		sum += val
		if(min>val){min=val}
		if(max<val){max=val}
	}

	document.write("AVG: "+durchschnitt(N).toFixed(decicount)+
	"<br>n<sub>min</sub>: "+min+
	", n<sub>max</sub>: "+max+
	"<br>s<sup>2</sup>: "+varianz(N).toFixed(decicount)+
	", s: "+standardabweichung(N).toFixed(decicount)+
	'</br>'+readTextFile("lemmamapping/_stats").replaceAll("\n","</br>"))
</script>
</body>
