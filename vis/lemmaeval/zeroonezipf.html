<!DOCTYPE html>
<meta charset="utf-8">
<head>
	<script src="../../lib/plotly-latest.min.js"></script>
	<script src="../../_assets/datahandler.js"></script>
	<script src="../../lib/config.js"></script>
</head>

<body>
<div id="myDiv"><!-- Plotly chart will be drawn inside this DIV --></div>
<script>

	var dataset = getQueryVariable("data")
	var min = getQueryVariable("min")
	
	data_arr = readTextFile(dataset).split("\n");
	maxval = 0
	date= []
	count = []
	colors = []
	yay = 0
	nay = 0
	
	for (var i = 0; i < data_arr.length; i++) {
		line = data_arr[i].trim();
		if(line.length>1){	
			tmp = line.split(sep)
			value  = parseInt(tmp[1])
			if(tmp[2]==='1'){yay+=1;color='green'}else{nay+=1;color='red';}
			if(min<value){
				date.push(tmp[0])
				count.push(value)
				colors.push(color)
				if (value>maxval ) {maxval = value}
			}
		}
	}

	diagramtitle = 'Lemmatisierungsfortschritt inkl ambig inkl <i>ignore</i><br><span style = "color:green";>ja('+yay+')</span> <span style = "color:red";>nein('+nay+')</span>'
	var data = [{
		x: date,
		y: count,
		type: 'scatter',
		mode: 'markers',
		marker: {
			color: colors,
			size:3
		}
	}];

	if (getQueryVariable("scale")==="log"){minval = Math.log(1);maxval=Math.log(maxval)}else{minval=0;maxval=maxval+(maxval/10)+1}
	var layout = {
		barmode: 'stack',
		title:{
			text:diagramtitle,
			font:diagramfont
			},
		hovermode:'x',
		xaxis: {
			automargin: true,
			linewidth: 1,
			title: {
				font: diagramfont
			},
			tickangle:90,
			tickfont:diagramfont
			},
		yaxis:{
			type:scale,
			range: [minval, maxval],
			title: {
				text: 'Häufigkeit (Abs)',
				font: diagramfont
				}
			},
		annotations: watermarke()
		};

	myPlot = Plotly.newPlot('myDiv', data, layout, plotlyconfiguration);

	myPlot = document.getElementById('myDiv')

	if(parent.document.getElementById('token') != undefined){
		myPlot.on('plotly_click', function(data) {
			token=data.points[0].x;
			parent.document.getElementById('token').value = token
			parent.updateTimeline()
		});
	}
	
	document.title = "Lemmafortschritt"

</script>
</body>
