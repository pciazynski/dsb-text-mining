<!doctype html>
<head>
	<meta charset="utf-8">
	<script src="../../lib/cytoscape.min.js"></script>
	<script src="../../_assets/datahandler.js"></script>
	<script src="../../lib/config.js"></script>
</head>

<style>
	#cy {
		width: 100%;
		height: 100%;
		position: absolute;
		top: 0px;
		left: 0px;
	}
</style>

<body>
<div id="cy"></div>

<script type = "module">

	var nodes = []
	var edges = []
	var dataset = getQueryVariable('data')
	var layout = getQueryVariable('layout')
	if(layout.length==0){layout='grid'}
	var network = readPHP(dataset).split('\n')
	var underscore = "_"

	for (var key in network){
		var tmp = network[key].split(sep)
		if(tmp.length>=2){
			if(nodes[underscore+tmp[0]] == null){nodes [underscore+tmp[0]] =  2*Math.log(tmp[2]+1)}
			nodes [underscore+tmp[1]] = 2*Math.log(tmp[2]+1)
			edges [underscore+tmp[0]+sep+underscore+tmp[1]] = 1
		}
	}
	
	var cy = cytoscape({
	container: document.getElementById('cy'),
	style: [{
		selector: 'node',
		css: {
			'label': 'data(label)', 
			'text-valign': 'center',
			'text-halign': 'center',
			'text-wrap': 'wrap',
			'height': function(ele){ return 10*Math.max(1,(""+ele.outdegree()).length);},
			'font-size': defNodeFont,
			'width': function(ele){ return 10*Math.max(1,(""+ele.indegree()).length);},
			'background-color': 'data(color)',
			'borderColor':'darkgray',
			'borderWidth':'1',
			'shape': 'circle'
			}
		},
		{
		selector: 'node.highlight',
		style: {
			'label': 'data(label)',
			'text-valign': 'center',
			'color':'white',
			'text-outline-color': 'red',
			'text-outline-width': 2
			}
		},
		{
			selector: "edge",
			css: {
			//'curve-style': 'bezier',
			//'control-point-step-size': '40',
			'width': 'data(weight)',
			'line-color':'gray'
		}
	}]});

	for (var key in nodes){
		if( key.length>0){
			cy.add({
				data: { id: key,
				color:getColor(key),
				width:nodes[key],
				height:nodes[key],
				label:key.replace("_","")
			}});
		}
	}

	for (var key in edges)  
		if( key.length>0)
		{
			tmp = key.split(sep)
			cy.add({
			data: {
				source:tmp[0],
				weight:1,
				target:tmp[1],
				}
			});
		}

	cy.layout({
		name: layout,
		minNodeSpacing:1
	}).run();


</script>
</body>
