<!DOCTYPE html>
<meta charset="utf-8">
<head>
	<script src="../../lib/plotly-latest.min.js"></script>
	<script src="../../_assets/datahandler.js"></script>
	<script src="../../lib/config.js"></script>
	<link rel="stylesheet" href="../../styles.css">
</head>

<body>
<div id="myDiv"><!-- Plotly chart will be drawn inside this DIV --></div>

<script>

	var dataset = getQueryVariable("data")
	var print = parseInt(getQueryVariable("print"))==1
	data_arr = readTextFile(dataset).split("\n");
	allText=""
	maxval = 0
	diagramtitle = "Normierungs-Eindeutigkeit"
	
	date= []
	count = []
	colors = []
	hovers = []
	print = true
	if(print){
		for (var i = 0; i < data_arr.length; i++) {
			line = data_arr[i];
			if(line.length>1){
				tmp = line.split(sep)
				value  = parseFloat(tmp[1]).toFixed(4)
				date.push(tmp[0])
				count.push(value)
				hovers.push(tmp[0]+"<br>uniqueness:"+value + "<br>unique: " + tmp[2] +"<br>ambig:"+tmp[3])
				if (value>maxval ) {maxval = value}
			}
		}
	}
	else{
		for (var i = 0; i < data_arr.length; i++) {
			line = data_arr[i];
			if(line.length>1){
				tmp = line.split(sep)
				value  = parseFloat(tmp[1]).toFixed(4)
				date.push(tmp[0])
				count.push(value)
				colors.push(getColor(tmp[0]))
				hovers.push(tmp[0]+"<br>uniqueness:"+value + "<br>unique: " + tmp[2] +"<br>ambig:"+tmp[3])
				if (value>maxval ) {maxval = value}
			}
		}
	}

	if (print){
		var data = [{
			x: date,
			y: count,
			hovertemplate: '%{text}',
			text:hovers,
			type: 'line',
			marker:{
				color:'black'
			}
		}];
	}else{
		var data = [{
			x: date,
			y: count,
			type: 'bar',
			hovertemplate: '%{text}',
			text:hovers,
			marker: {
				color: colors
			}
		}];
	}

	var layout = {
		barmode: 'stack',
		title:diagramtitle,
		hovermode:'x',
		xaxis: {
			automargin: true,
			linewidth: 1,
			title: {
				font: diagramfont
			},
			showticklabels:false
			},
		yaxis: {
			automargin: true,
			type:scale,
			title: {
				text: 'Uniqueness',
				font: diagramfont
				}
			},
		annotations: watermarke()
	};

	myPlot = Plotly.newPlot('myDiv', data, layout, plotlyconfiguration);
	myPlot = document.getElementById('myDiv')
	myPlot.on("plotly_click", function(data) {
		lemma=data.points[0].x;
		parent.pointClick(lemma,data.points[0].text)
	});
	document.title = diagramtitle

</script>
</body>
