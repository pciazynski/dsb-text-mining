<!DOCTYPE html>
<meta charset="utf-8">
<head>
	<script src="../../lib/plotly-latest.min.js"></script>
	<script src="../../lib/def_language.js"></script>
	<script src="../../lib/my_language.js"></script>
	<script src="../../_assets/datahandler.js"></script>
	<script src="../../lib/config.js"></script>
</head>

<body>
<div id="myDiv"><!-- Plotly chart will be drawn inside this DIV --></div>
<script>

	diagramtitle = ""
	var lemmalist = getQueryVariable("lemma").split(",")
	var jitter = getQueryVariable("jitter")
	if(jitter.length==0){jitter=defjitter}else{jitter = parseFloat(jitter)}
	diagramtitle="Jahressumme Lemma inkl. ambig"
	var data = []
	maxval = 0
	minval = 10000000
	entrycount = 0

	for (key in lemmalist){
		lemma = lemmalist[key]
		lemmacol = getColor('|'+lemma+'|')
		diagramtitle += ' <span style="color:'+lemmacol+'">'+lemma+'</span>'
		var dataset = getQueryVariable("data")
		dataset = dataset +"?lemma="+lemma+"&sort"
		data_arr = readPHP(dataset).split("\n");
		if(data_arr.length>resultsetmax){document.write(lang_error_resultset_too_large);}
		else{
			aggrodata = []
			for (var i = 0; i < data_arr.length; i++) {
				if(data_arr[i].trim().length>0){
					tmp = data_arr[i].split(sep)
					if(aggrodata[tmp[1]] != undefined){
						aggrodata[tmp[1]] = aggrodata[tmp[1]] + parseInt(tmp[2])
					}
					else{
						aggrodata[tmp[1]] = parseInt(tmp[2])
					}
				}
			}
			date= []
			count = []

			for (key in aggrodata){
				date.push(key)
				count.push(aggrodata[key])
				if (aggrodata[key]<minval ){minval = aggrodata[key]}
				if (aggrodata[key]>maxval ) {maxval = aggrodata[key]}
			}
		
			entrycount += date.length
			var trace = {
				x: date,
				y: count,
				name:lemma,
				mode: 'markers',
				marker: {
					//size:markersize(date.length),
					opaciy:0.2,
					color:getColor('|'+lemma+'|')
				},
			};
			data.push(trace)
		}
	}
	
		if (getQueryVariable("scale")==="log"){minval = Math.log(1);maxval=Math.log(maxval)}else{minval=0;maxval=maxval+(maxval/10)+1}
		var layout = {
			hovermode:"closest",
			title:{
				text:diagramtitle,
				font:diagramfont
				},
			xaxis:{
				automargin: true,
				range:[minDate-2,maxDate+2],
				linewidth: 1,
				title:{
					font:diagramfont
				},
				tickangle:90,
				tickfont:diagramfont
			},
			yaxis:{
				type:scale,
				range: [minval, maxval],
				title:{
					text: 'Häufigkeit (Abs)',
					font:diagramfont
					}
				},
			annotations: watermarke()
		};
		myPlot = Plotly.newPlot('myDiv', data, layout, plotlyconfiguration);

</script>
</body>
