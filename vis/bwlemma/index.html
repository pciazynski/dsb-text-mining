<script>
	yearminslider.oninput = function() {
		otherslider=document.getElementById("yearmaxslider")
		otherslider.value=Math.max(otherslider.value,this.value)
		yearminvalue.innerHTML = this.value
		yearmaxvalue.innerHTML = otherslider.value
	}

	yearmaxslider.oninput = function() {
		otherslider=document.getElementById("yearminslider")
		otherslider.value=Math.min(otherslider.value,this.value)
		yearminvalue.innerHTML = otherslider.value
		yearmaxvalue.innerHTML = this.value
	}
	yearminslider.min=minDate

	
	yearmaxslider.min = minDate
	yearmaxslider.max = maxDate
	yearminslider.min = minDate
	yearminslider.max = maxDate
	yearminslider.value = minDate
	yearmaxslider.value = maxDate
	yearminvalue.innerHTML=minDate
	yearmaxvalue.innerHTML = maxDate

</script>

<script>

	var switchDtsCts = function(){
		elsrc = document.getElementById('docref').src;
		if(elsrc.includes("&textapi=dts")){
			document.getElementById('docref').src = elsrc.replace("&textapi=dts","")
		}else{
			document.getElementById('docref').src = elsrc+"&textapi=dts"
		}
	}
	
	var switchPrefixsearch = function(){
		tmp = document.getElementById('prefixsearchCheckBox').checked
		if(tmp){tmp = 'alphabet'}else{tmp = 'frequency'}
		autocomplete("lemma", "prefixlemmasearch.php?limit=30&sortby="+tmp+"&lemma=", ""); 
	}

	var switchpercenttimeline  = function(elid){
		tmp = document.getElementById(elid)
		url = tmp.src.replaceAll("sum.html",".html")
		if(url.includes("percenttimeline")){
			tmp.src = url.replace("percenttimeline","timeline")
		}else{
			tmp.src = url.replace("timeline","percenttimeline")
		}
	}
	
	var switchtimelinesum = function(elid){
		tmp = document.getElementById(elid)
		url = tmp.src.replaceAll("percent","")
		if(tmp.src.includes("timelinesum")){
			tmp.src = url.replace("timelinesum","timeline")
		}else{
			tmp.src = url.replace("timeline","timelinesum")
		}
	}

	var addToList = function(){
		tmp = document.getElementById("lemma").value.trim()
		tmp2 = document.getElementById("lemmalist").value.trim()
		str = ""
		if(tmp.length>0){
			if(tmp2.length>0){str = ","}
			str = tmp2+str+tmp
			document.getElementById("lemmalist").value = str
			updateTimelineList()
		}
	}
	
	var updateYearlabel = function(){
		tmp = parseInt(document.getElementById("yearminslider").value)
		document.getElementById("yearlabel").innerHTML = tmp
	}

	
	var updateTravizYear = function(){
		if(exactitem.trim().length>0){
			loading("traviz")
			loading("docref")
			url = document.getElementById("traviz").src.split("&year")[0]
			yearfrom = document.getElementById("yearminslider").value
			yearto = document.getElementById("yearmaxslider").value
			year = "BETWEEN " + yearfrom + " AND " + yearto
			document.getElementById("traviz").src = "traviz.html?data=lemmatokenperyear.php&lemma="+exactitem+"&exact=1&sort&year="+year
			document.getElementById('docref').src = 'doclist.html?data=urnbylemma.php&lemma='+exactitem+"&year="+year
		}
	}
	
	var callDolnoserbski = function(){
		curitem = document.getElementById("lemma").value.trim()
		if(curitem.length>0){
			window.open("https://dolnoserbski.de/ortografija/slownik?wuraz="+curitem, "_blank")
		}
	}
	
	var callLemmatree = function(){
		curitem = document.getElementById("lemma").value.trim()
		if(curitem.length>0){
			window.open("../lemmavariation?lemma="+curitem+"&headerconf="+headerconf, "_blank")
		}
	}
	
	
	var updateFocus = function(newfocus){
		if(curitem.length>0){
			focus = newfocus
			sourcearr = document.getElementById("timeline").src.split("&focus=")
			source = sourcearr[0]+sourcearr[1].slice(1)+"&focus="+focus
			if(source.includes("timelinesumlist")){source = source.replaceAll("timelinesumlist","timeline")}
			if(focus==3){
				document.getElementById("focusbutton0").style.boxShadow  = "none"
				document.getElementById("focusbutton3").style.boxShadow  = "-7px 0px 3px 6px white"
				source = source.replace("lemmasumperyear","lemmacountperyear")}
			else{
				document.getElementById("focusbutton3").style.boxShadow  = "none"
				document.getElementById("focusbutton0").style.boxShadow  = "7px 0px 3px 6px white"
				source = source.replace("lemmacountperyear","lemmasumperyear")
			}
			loading("timeline")
			document.getElementById("timeline").src=source
			document.title=lang_lemmafy+" "+curitem
			document.getElementById('docref').src = 'error_docref.html'
			document.getElementById('switchtimelinesumbutton').disabled = false;
			document.getElementById('switchpercenttimelinebutton').disabled = false;
		}
	}
	
	var updateTimelineRegex = function(){
		curitem = document.getElementById("regexsearch").value.trim()
		if(curitem.length>0){
			loading("timeline")
			loading("lemmagroup")
			loading("tokengroup")
			document.getElementById("timeline").src="timeline.html?data=lemmaregexsearch.php&lemma="+curitem+"&sort&focus="+focus
			document.getElementById("lemmagroup").src="lemmalist.html?data=lemmaregexgroup.php&lemma="+curitem+"&sort"
			document.getElementById("tokengroup").src="tokenlist.html?data=lemmaregex2token.php&lemma="+curitem+"&sort"
			document.title=lang_lemmafy+" "+curitem
			document.getElementById('docref').src = 'error_docref.html'
			document.getElementById('traviz').src = 'error_docref.html'
			document.getElementById('switchtimelinesumbutton').disabled = false;
			document.getElementById('switchpercenttimelinebutton').disabled = false;
		}
	}

	var updateTimelineList = function(){
		curitem = document.getElementById("lemmalist").value.trim()
		if(curitem.length>0){
			loading("timeline")
			loading("lemmagroup")
			loading("tokengroup")
			document.getElementById("focusbutton0").style.boxShadow  = "none"
			document.getElementById("focusbutton3").style.boxShadow  = "none"
			if(focus==3){funcall = "lemmacountperyear"}else{funcall="lemmasumperyear"}
				document.getElementById("timeline").src="timelinesumlist.html?data="+funcall+".php&lemma="+curitem+"&sort&focus="+focus
				document.getElementById("lemmagroup").src="lemmalist.html?data=lemmagroup.php&lemma="+curitem+"&sort"
				document.getElementById("tokengroup").src="tokenlist.html?data=lemmatoken.php&lemma="+curitem+"&sort"
			document.title=lang_lemmafy+" "+curitem
			document.getElementById('traviz').src = 'error_docref.html'
			document.getElementById('docref').src = 'error_docref.html'
			document.getElementById('switchtimelinesumbutton').disabled = true;
			document.getElementById('switchpercenttimelinebutton').disabled = true;
		}
	}

	var updateTimeline = function(){
		curitem = document.getElementById("lemma").value.trim()
		if(curitem.length>0){
			loading("timeline")
			loading("lemmagroup")
			loading("tokengroup")
			if(focus==3){funcall = "lemmacountperyear"}else{funcall="lemmasumperyear"}
				document.getElementById("timeline").src="timeline.html?data="+funcall+".php&lemma="+curitem+"&sort&focus="+focus
				document.getElementById("lemmagroup").src="lemmalist.html?data=lemmagroup.php&lemma="+curitem+"&sort"
				document.getElementById("tokengroup").src="tokenlist.html?data=lemmatoken.php&lemma="+curitem+"&sort"
			document.title=lang_lemmafy+" "+curitem
			document.getElementById('traviz').src = 'error_docref.html'
			document.getElementById('docref').src = 'error_docref.html'
			document.getElementById('switchtimelinesumbutton').disabled = false;
			document.getElementById('switchpercenttimelinebutton').disabled = false;
		}
	}

	var itemClick = function(item){
		loading("timeline")
		loading("tokengroup")
		loading("traviz")
		loading("docref")
		exactitem=item
		if(focus==3){funcall = "lemmacountperyear"}else{funcall="lemmasumperyear"}
		document.getElementById("timeline").src="timeline.html?data="+funcall+".php&lemma="+exactitem+"&exact=1&focus="+focus
		document.getElementById("tokengroup").src="tokenlist.html?data=lemmatoken.php&lemma="+exactitem+"&sort&exact=1"
		url = document.getElementById("traviz").src.split("&year")[0].replaceAll("&exact=0","")
		yearfrom = document.getElementById("yearminslider").value
		yearto = document.getElementById("yearmaxslider").value
		year = "BETWEEN " + yearfrom + " AND " + yearto
		document.getElementById("traviz").src = "traviz.html?data=lemmatokenperyear.php&lemma="+exactitem+"&exact=1&sort&year="+year
		document.getElementById('docref').src = 'doclist.html?data=urnbylemma.php&lemma='+exactitem+"&year="+year
		document.title=lang_lemmafy+" "+exactitem
		document.getElementById('switchtimelinesumbutton').disabled = false;
		document.getElementById('switchpercenttimelinebutton').disabled = false;
	}
	
	var focus = 0;
	document.getElementById("focusbutton0").style.boxShadow  = "7px 0px 3px 6px white"
	curitem = getQueryVariable("lemma")
	exactitem = ""
	if(curitem.length>0){
		document.getElementById("lemma").value = curitem
		updateTimeline()
		document.getElementById("lemma").scrollIntoView()
	}
	else{
		document.getElementById('timeline').src="error_token.html"
		document.getElementById('lemmagroup').src="error_token.html"
		document.getElementById('tokengroup').src="error_token.html"
	}
	document.title=lang_lemmafy+" "+curitem

</script>
