<!DOCTYPE html>
<meta charset="utf-8">
<head>
	<script src="../../lib/plotly-latest.min.js"></script>
	<script src="../../_assets/datahandler.js"></script>
	<script src="../../lib/config.js"></script>
</head>

<body>
<div id="myDiv"><!-- Plotly chart will be drawn inside this DIV --></div>
<script>

	var dataset = getQueryVariable("data")
	var max = getQueryVariable("max")
	var min = getQueryVariable("min")
	var limit = getQueryVariable("limit")
	var offset = getQueryVariable("offset")
	var groupBy = getQueryVariable("groupBy")
	if(offset.length==0){offset=0}
	
	if(dataset.includes(".php")){
		dataset+="?sort&year="+getQueryVariable("year")+"&groupBy="+groupBy
		if(limit.length>0){dataset+="&limit="+limit+"&offset="+offset}
		data_arr = readPHP(dataset).split("\n");
		diagramtitle = "Tokenhäufigkeiten "+getQueryVariable("year")
		offset=0;
	}
	else{
		data_arr = readTextFile(dataset).split("\n");
		diagramtitle = "Tokenhäufigkeiten "+dataset.split("/")[1]
	}
	allText=""
	maxval = 0
	
	
	date= []
	count = []
	colors = []
	limit=parseInt(limit)
	if(limit.length==0 || limit>data_arr.length){limit=data_arr.length}
	for (var i = offset; i < limit; i++) {
		line = data_arr[i];
		if(line.length>1){	
			tmp = line.split(sep)
			value  = parseInt(tmp[1])
			if(max.length>0 & value > parseInt(max)){continue}
			if(min.length>0 & value < parseInt(min)){continue}
			date.push(tmp[0])
			count.push(value)
			colors.push(getColor(tmp[0]))
			if (value>maxval ) {maxval = value}
		}
	}
	if (getQueryVariable("scale")==="log"){minval = Math.log(1);maxval=Math.log(maxval)}else{minval=0;maxval=maxval+(maxval/10)+1}

	var data = [{
		x: date,
		y: count,
		type: 'bar',
		marker: {
			color: colors
		}
	}];

	var layout = {
		barmode: 'stack',
		title:diagramtitle,
		xaxis: {
			automargin: true,
			linewidth: 1,
			title: {
				font: diagramfont
			},
			tickangle:90,
			tickfont:diagramfont
			},
		yaxis:{
			type:scale,
			range: [minval, maxval],
			title: {
				text: 'Häufigkeit (Abs)',
				font: diagramfont
				}
			},
		annotations: watermarke()
		};

	myPlot = Plotly.newPlot('myDiv', data, layout, plotlyconfiguration);

	myPlot = document.getElementById('myDiv')

	if(parent.document.getElementById('token') != undefined){
		myPlot.on('plotly_click', function(data) {
			token=data.points[0].x;
			parent.document.getElementById('token').value = token
			parent.updateTimeline()
		});
	}
	
	document.title = diagramtitle

</script>
</body>
