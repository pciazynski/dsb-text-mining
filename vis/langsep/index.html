<!DOCTYPE html>
<meta charset="utf-8">
<head>
	<script src="../../lib/config.js"></script>
	<script src="../../lib/def_language.js"></script>
	<script src="../../lib/my_language.js"></script>
	<script src="../../_assets/datahandler.js"></script>
	<script src="../../_assets/gui.js"></script>
	<script src="../../_assets/autocomplete.js"></script>
	<link rel="stylesheet" href="../../digilabstyles.css">
</head>
<body style="background-color:lightgray">
<script>document.write(header())</script>
<p style="text-align:center;">
	Tiepmar, J. (2026). n-Gram based Language Separation for Minority Languages. Zenodo. https://doi.org/10.5281/zenodo.19111631</br>
</p>
<br><br>

<div class = "explain">
	<p>
		Hier werden als DEU klassifizierte Tokens nach Häufigkeit sortiert dargestellt (Zipf Ranking)
	</p>
</div>

<table class="optionmenu" align="center">
	<tr>
		<td style="text-align:right;">Anzahl</td>
		<td>
			<input type="number" min="0" value="10000" id="limit" onchange="updateZipf()">
		</td>
	</tr>
	<tr>
		<td style="text-align:right;">Offset</td>
		<td>
			<input type="number" min="0" value="0" id="offset" onchange="updateZipf()">
		</td>
	</tr>
</table>


<div class = "iframediv">
	<button class = "iframebutton" onclick="embedding('zipf');"><script>document.write(lang_htmlembedding)</script></button>
	<button class = "iframebutton" onclick="diagrammlink('zipf');"><script>document.write(lang_fullscreen)</script></button>
	<button class = "iframebutton" onclick="datalink('zipf');"><script>document.write(lang_rawdata)</script></button>
	<div style="text-align:center;">
		<iframe class="resized"  width="100%" height="475px" id="zipf" scrolling="yes"></iframe>
	</div>
	<button class = "iframebutton" onclick="threeD('zipf');"><script>document.write(lang_freq_or_wordlengthfreq)</script></button>
	<button class = "iframebutton" onclick="switchLogScale('zipf');"><script>document.write(lang_switchlogscale)</script></button>
	<button class = "iframebutton" onclick="hidewatermark('zipf');"><script>document.write(lang_source)</script></button>
	</div>
<br><br>


<script>

	var updateZipf = function(){
		loading("zipf")
		tmp = document.getElementById("limit").value.trim()
		tmp2 = document.getElementById("offset").value.trim()
		if(document.getElementById("zipf").src.includes("3d.html")){funcall="zipf3d"}else{funcall="zipf"}
		document.getElementById("zipf").src=funcall+".html?data=langDetect3/deu&limit="+tmp+"&offset="+tmp2
	}
	
	var threeD = function(iframeid){
		loading(iframeid)
		el = document.getElementById(iframeid)
		if(el.src.includes("3d.html")){
			el.src=el.src.replace("3d.html",".html")
		}else{
			el.src=el.src.replace(".html","3d.html")
		}
	}

	updateZipf()

</script>

<br><br>

<script>
	document.write(footer())
</script>
</body>
