<!DOCTYPE html>
<meta charset="utf-8">
<head>
	<script src="../../lib/plotly-latest.min.js"></script>
	<script src="../../_assets/datahandler.js"></script>
	<script src="../../lib/config.js"></script>
</head>

<body>
<div id="myDiv"><!-- Plotly chart will be drawn inside this DIV --></div>
<script>

	diagramtitle = ""
	dataset = getQueryVariable("data")
	count = getQueryVariable("count")
	offset = getQueryVariable("offset")
	if(offset.length==0){offset = 0}else{offset=parseInt(offset)}
	if(count.length==0){count = 0}else{count=parseInt(count)}
	data_arr = readTextFile(dataset).split("\n");
	date = []
	shapes = []
	colors = []
	points = []
	var hoverrowssize = 10
	var labelstmp= []
	var hoverlabelsize = []

	function addLabel(date,str){
		if(labelstmp[date] !=null){
			delim = ","	
			if(hoverlabelsize[date]++ == hoverrowssize){delim=",<br>";hoverlabelsize[date] = 0;};
			labelstmp[date]=(labelstmp[date]+delim+str)
		} else {
			hoverlabelsize[date] = 0;
			labelstmp[date]=str
		}
	}

	if(count> data_arr.length){count= data_arr.length}

	for (var i = offset; i < offset+count; i++) {
		line = data_arr[i]
		if(line.length>1){
			tmp = line.trim().split(sep)
			dateA = tmp[1]
			dateB = tmp[2]
			if (dateA === dateB){date[dateA]=i;addLabel(dateA,tmp[0])}
			else{date[dateA]=i;date[dateB]=i;addLabel(dateA,tmp[0]+"⇒");addLabel(dateB,"⇒"+tmp[0])}

			color = stringToColour(tmp[0]+" "+tmp[1]+" "+tmp[2])
			if(dateA == dateB){dateB=parseInt(dateB)+0.5}
			arr = {ysizemode:"scaled",layer:"below","type": 'rect', "xref": 'x',"yref": 'y',"x0": dateA,"y0": i,  "x1": dateB,  "y1": i+0.9,"fillcolor": color,"opacity": 0.6,line:{width:0}}
			shapes.push(arr)
		}
	}

	data = []
	labels =[]
	count=[]

	for (var key in date) {
		data.push(key)
		labels.push(labelstmp[key])
		count.push(date[key])
		colors.push(stringToColour(labelstmp[key].replaceAll("⇒","").trim()))
	}

	var data = [{
		x: data,
		y: count,
		hovertext:labels,
		hovermode:"closest",
		mode: 'markers',
		marker:{
				color:"white",
				opacity:0.0,
				size:1,
				line:{
					width:0
				}
			},
	}];

	var layout = {
		xaxis: 	{
			automargin: true,
			range:[minDate-2,maxDate+2],
			linewidth: 1,
			title: {
				font: diagramfont
			},
			tickangle:90,
			tickfont:diagramfont
		},
		yaxis: {
			title: {
				font: diagramfont
				},
			},
		annotations: watermarke(),
		shapes: shapes
	};

	myPlot = Plotly.newPlot('myDiv', data, layout, plotlyconfiguration);

	var myPlot = document.getElementById('myDiv')
	myPlot.on('plotly_click', function(data){
		alert(data.points[0].x+":\n"+data.points[0].hovertext.replaceAll("<br>","").trim());
		//var point = data.y;
		//x=data.points[0].x
	//	parent.document.getElementById('currentDate').value =x
	})

	myPlot.on("plotly_selected", function(eventData) {
		von = (" "+eventData.range.x[0]).split(".")[0].trim()
		bis = (" "+eventData.range.x[1]).split(".")[0].trim()
		parent.document.getElementById("network").src = "network.html?data="+dataset+"&von="+von+"&bis="+bis
	});
</script>
</body>
