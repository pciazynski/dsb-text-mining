<!DOCTYPE html>
<meta charset="utf-8">
<head>
	<script src="../../lib/plotly-latest.min.js"></script>
	<script src="../../_assets/datahandler.js"></script>
	<script src="../../lib/config.js"></script>
</head>

<body>
<div id="myDiv"><!-- Plotly chart will be drawn inside this DIV --></div>
<script>
	var dataset = getQueryVariable("data")
	var print = getQueryVariable("print")

	data_arr = readTextFile(dataset).trim().split("\n");

	date= []
	count = []

	diagramtitle = dataset.split(".php")[0]
	maxval = 0
	
	for (var i = 0; i < data_arr.length; i++) {
		line = data_arr[i];
		if(line.length>1){
			tmp = line.split(sep)
			value  = parseFloat(tmp[1])
			if(value>maxval){maxval=value}
			date.push(tmp[0])
			count.push(value)
		}
	}
	
	if(print==="1" || dataset.includes("ratio")){
		var data = [{
			x: date,
			y: count,
			type: 'scatter',
			mode: "markers",
				marker: {
				color: "black"
			}
		}];
	}
	else{
		var data = [{
			x: date,
			y: count,
			type: 'bar',
				marker: {
				color: "black"
			}
		}];
	}

	
	if (getQueryVariable("scale")==="log"){minval = Math.log(1);maxval=Math.log(maxval)}else{minval=0;maxval=maxval+maxval/10}
	if (dataset.includes("ratio")){scale="lin";minval = 0;maxval=1.1}
	var layout = {
		title:{
			text:diagramtitle,
			font: diagramfont
		},
		xaxis: {
			range:[minDate,maxDate],
			title: {
				font: diagramfont
			},
			tickangle: 90,
			tickfont: diagramfont
		},
		yaxis: {
			type:scale,
			range: [minval, maxval],
			zeroline:false
		},
		annotations: watermarke()
	};

	myPlot = Plotly.newPlot('myDiv', data, layout, plotlyconfiguration);

	document.title = diagramtitle

</script>
</body>
