<div class = "explain">
	<p>
		Hier werden Tokens nach Häufigkeit sortiert dargestellt (Zipf Ranking). Häufige Worte sind idR kurz und allgemein, seltene Worte länger und spezieller. Circa die Hälfte der Tokens in einem Korpus kommt nur einmal vor und können daher für viele statistische Analysen ignoriert werden.
	</p>

<script>
	yearminslider.oninput = function() {
		otherslider=document.getElementById("yearmaxslider")
		otherslider.value=Math.max(otherslider.value,this.value)
		yearminvalue.innerHTML = this.value
		yearmaxvalue.innerHTML = otherslider.value
	}

	yearmaxslider.oninput = function() {
		otherslider=document.getElementById("yearminslider")
		otherslider.value=Math.min(otherslider.value,this.value)
		yearminvalue.innerHTML = otherslider.value
		yearmaxvalue.innerHTML = this.value
	}
	yearminslider.min=minDate

	
	yearmaxslider.min = minDate
	yearmaxslider.max = maxDate
	yearminslider.min = minDate
	yearminslider.max = maxDate
	yearminslider.value = minDate
	yearmaxslider.value = maxDate
	yearminvalue.innerHTML=minDate
	yearmaxvalue.innerHTML = maxDate

</script>

<script>
	var zipfClick = function(tmp){
		document.getElementById("timelinelink").innerHTML = '<a target="_blank" href="../bwword?word='+tmp+'">'+lang_timeline+'</a> '+tmp;
		document.getElementById("profilelink").innerHTML = '<a target="_blank" href="../profile?word='+tmp+'">'+lang_profile+'</a> ';
	}
	
	var switchTokenType = function(elementid){
		loading(elementid)
		url = document.getElementById(elementid).src
		if(url.includes('_tokensumperyear')){url=url.replaceAll('_tokensumperyear','_typesumperyear')}else{url=url.replaceAll('_typesumperyear','_tokensumperyear').replaceAll('_typetokenratioperyear','_tokensumperyear')}
		document.getElementById(elementid).src = url
	}

	var switchTokenTypeRatio = function(elementid){
		loading(elementid)
		url = document.getElementById(elementid).src
		url=url.replaceAll('_tokensumperyear','_typetokenratioperyear').replaceAll('_typesumperyear','_typetokenratioperyear')
		document.getElementById(elementid).src = url
	}
	
	var callDolnoserbski = function(){
		tmp = document.getElementById("token").value.trim()
		if(tmp.length>0){
			window.open("https://dolnoserbski.de/ortografija/slownik?wuraz="+tmp, "_blank")
		}
	}

	var updateZipf = function(){
		loading("zipf")
		tmp = document.getElementById("limit").value.trim()
		tmpyear1 = parseInt(document.getElementById("yearminslider").value)
		tmpyear2 = parseInt(document.getElementById("yearmaxslider").value)
		if(document.getElementById("zipf").src.includes("3d.html")){funcall="zipf3d"}else{funcall="zipf"}
		if(tmpyear1 == tmpyear2){
			document.getElementById("zipf").src=funcall+".html?data=bagofwordsperyear/"+tmpyear1+"&limit="+tmp
		}
		else{
			if(tmpyear1 == minDate && tmpyear2 == maxDate){
				document.getElementById("zipf").src=funcall+".html?data=bagofwords/_all&limit="+tmp
			}
			else{
				document.getElementById("zipf").src=funcall+".html?data=tokencountdaterange.php&sort&year=BETWEEN "+tmpyear1+" AND "+tmpyear2+"&limit="+tmp
			}
		}
	}
	
	updateZipf()
	document.title=lang_words+" "+lang_statistics
	document.getElementById('datesum').src = 'timebarchart.html?data=stats/_tokensumperyear'

</script>
