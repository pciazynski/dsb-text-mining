<script>

	var linreg = function(iframeid){
		tmp = document.getElementById("filter").value.trim()
		if(tmp.length>0){
			if(document.getElementById(iframeid).src.includes("timeline.html") && tmp.split(" ").length==3){
				loading(iframeid)
				document.getElementById(iframeid).src=document.getElementById(iframeid).src.replaceAll("timeline.html","linreg_chart.html")
			}else if(document.getElementById(iframeid).src.includes("linreg_chart.html")){
				loading(iframeid)
				document.getElementById(iframeid).src=document.getElementById(iframeid).src.replaceAll("linreg_chart.html","timeline.html")
			}
		}
	}
	
	var updateNGram = function(){
		loading('ngram')
		loading('timeline')
		tmp = document.getElementById("filter").value.trim()
		if(tmp.split(" ").length==n){
			document.getElementById('timeline').src = "timeline.html?data=ngramperyearexact.php&filter="+tmp+"&n="+n
			document.getElementById('ngram').src = "ngram.html?data=ngramexact.php&frequency=1&n="+n+"&filter="+tmp
		}else{
			document.getElementById('timeline').src = "timeline.html?data=ngramperyear.php&filter="+tmp+"&n="+n
			document.getElementById('ngram').src = "ngram.html?data=ngram.php&frequency=1&n="+n+"&filter="+tmp
		}
	}
	
	var updateZipf = function(){
		loading('zipf')
		min = document.getElementById("min").value.trim()
		document.getElementById('zipf').src="zipf.html?data=ngram.php&frequency="+min+"&n="+n
	}

	if(n.length==0){n=3}

	updateZipf()
	document.title=n+"Gram "

//	updateNGram()

</script>
