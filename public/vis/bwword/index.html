  <script>
    var switchPrefixsearch = function () {
      autocomplete(
        'searchinput',
        'prefixsearch.php?limit=30&sortby=alphabet&word=',
        'updateTimeline',
      );
    };

    var threeD = function (iframeid) {
      loading(iframeid);
      el = document.getElementById(iframeid);
      if (el.src.includes('3d.html')) {
        el.src = el.src.replace('3d.html', '.html');
      } else {
        el.src = el.src.replace('.html', '3d.html');
      }
    };

    var linreg = function (iframeid) {
      loading(iframeid);
      var term = document.getElementById('searchinput').value.trim();
      if (term.length > 0) {
        var urls = buildVisUrls('token', term, {}, 1);
        var page = document.getElementById(iframeid).src.includes('linreg_chart.html')
          ? 'timeline.html'
          : 'linreg_chart.html';
        document.getElementById(iframeid).src = urls.timeline.replace('timeline.html', page);
      }
    };

    var callDolnoserbski = function () {
      var term = document.getElementById('searchinput').value.trim();
      if (term.length > 0) {
        window.open('https://dolnoserbski.de/ortografija/slownik?wuraz=' + term, '_blank');
      }
    };

    var switchpercenttimeline = function (elid) {
      var frame = document.getElementById(elid);
      var url = frame.src.replaceAll('sum.html', '.html').replaceAll('linreg_chart', 'timeline');
      if (url.includes('percenttimeline')) {
        frame.src = url.replace('percenttimeline', 'timeline');
      } else {
        frame.src = url.replace('timeline', 'percenttimeline');
      }
    };

    var updateTimeline = function () {
      var term = document.getElementById('searchinput').value.trim();
      if (term.length > 0) {
        loading('timeline');
        loading('wordinfo');
        var urls = buildVisUrls('token', term, {}, 1);
        document.getElementById('timeline').src = urls.timeline;
        document.getElementById('wordinfo').src = urls.wordinfo;
        document.title = 'Word ' + term;
        document.getElementById('switchlinreg').disabled = false;
      }
    };

    restoreSearchFromLocation(document, window.location.search, 'token');
    var curword = document.getElementById('searchinput').value;
    if (curword.length > 0) {
      updateTimeline();
      document.getElementById('wordinfo').scrollIntoView();
    } else {
      document.getElementById('wordinfo').src = 'error_token.html';
      document.getElementById('timeline').src = 'error_token.html';
    }

    document.title = 'Wort ' + curword;
  </script>
