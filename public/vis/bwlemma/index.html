  <script>
    yearminslider.oninput = function () {
      otherslider = document.getElementById('yearmaxslider');
      otherslider.value = Math.max(otherslider.value, this.value);
      yearminvalue.innerHTML = this.value;
      yearmaxvalue.innerHTML = otherslider.value;
    };

    yearmaxslider.oninput = function () {
      otherslider = document.getElementById('yearminslider');
      otherslider.value = Math.min(otherslider.value, this.value);
      yearminvalue.innerHTML = otherslider.value;
      yearmaxvalue.innerHTML = this.value;
    };
    yearminslider.min = minDate;

    yearmaxslider.min = minDate;
    yearmaxslider.max = maxDate;
    yearminslider.min = minDate;
    yearminslider.max = maxDate;
    yearminslider.value = minDate;
    yearmaxslider.value = maxDate;
    yearminvalue.innerHTML = minDate;
    yearmaxvalue.innerHTML = maxDate;
  </script>

  <script>
    var switchDtsCts = function () {
      elsrc = document.getElementById('docref').src;
      if (elsrc.includes('&textapi=dts')) {
        document.getElementById('docref').src = elsrc.replace('&textapi=dts', '');
      } else {
        document.getElementById('docref').src = elsrc + '&textapi=dts';
      }
    };

    var switchPrefixsearch = function () {
      var sortby = document.getElementById('prefixsearchCheckBox').checked
        ? 'alphabet'
        : 'frequency';
      var caseSensitive = document.getElementById('csCheckBox').checked ? '1' : '0';
      autocomplete(
        'searchinput',
        'prefixlemmasearch.php?limit=30&sortby=' + sortby + '&cs=' + caseSensitive + '&lemma=',
        '',
      );
    };

    var switchpercenttimeline = function (elid) {
      tmp = document.getElementById(elid);
      url = tmp.src.replaceAll('sum.html', '.html');
      if (url.includes('percenttimeline')) {
        tmp.src = url.replace('percenttimeline', 'timeline');
      } else {
        tmp.src = url.replace('timeline', 'percenttimeline');
      }
    };

    var switchtimelinesum = function (elid) {
      tmp = document.getElementById(elid);
      url = tmp.src.replaceAll('percent', '');
      if (tmp.src.includes('timelinesum')) {
        tmp.src = url.replace('timelinesum', 'timeline');
      } else {
        tmp.src = url.replace('timeline', 'timelinesum');
      }
    };

    // The clicked item is a concrete lemma cell: literal, unambiguous, single term.
    var exactOptions = { cs: true, regex: false, list: false, trim: true, ambig: false };

    var setSrc = function (elid, url) {
      document.getElementById(elid).src = url;
    };

    var highlightFocus = function (activefocus) {
      document.getElementById('focusbutton0').style.boxShadow =
        activefocus === 0 ? '7px 0px 3px 6px white' : 'none';
      document.getElementById('focusbutton3').style.boxShadow =
        activefocus === 3 ? '-7px 0px 3px 6px white' : 'none';
    };

    var updateTravizYear = function () {
      if (exactitem.trim().length === 0) {
        return;
      }
      loading('traviz');
      loading('docref');
      var yearfrom = document.getElementById('yearminslider').value;
      var yearto = document.getElementById('yearmaxslider').value;
      var query = searchQueryString('lemma', exactitem, exactOptions);
      // CEILING: lemmatokenperyear.php still takes a raw SQL year clause while urnbylemma.php
      // takes a `from-to` range; upgrade: give lemmatokenperyear.php the same year whitelist.
      setSrc(
        'traviz',
        'traviz.html?data=lemmatokenperyear.php&' +
          query +
          '&exact=1&sort&year=BETWEEN ' +
          yearfrom +
          ' AND ' +
          yearto,
      );
      setSrc(
        'docref',
        'doclist.html?data=urnbylemma.php&' + query + '&year=' + yearfrom + '-' + yearto,
      );
    };

    var callDolnoserbski = function () {
      var curterm = document.getElementById('searchinput').value.trim();
      if (curterm.length > 0) {
        window.open('https://dolnoserbski.de/ortografija/slownik?wuraz=' + curterm, '_blank');
      }
    };

    var callLemmatree = function () {
      var curterm = document.getElementById('searchinput').value.trim();
      if (curterm.length > 0) {
        window.open('../lemmavariation?lemma=' + curterm + '&headerconf=' + headerconf, '_blank');
      }
    };

    var updateTimeline = function () {
      var options = searchOptionsFromForm(document);
      var urls = buildVisUrls(
        'lemma',
        document.getElementById('searchinput').value,
        options,
        focus,
      );
      if (!urls) {
        return;
      }
      loading('timeline');
      loading('lemmagroup');
      loading('tokengroup');
      curitem = document.getElementById('searchinput').value.trim();
      exactitem = '';
      setSrc('timeline', urls.timeline);
      setSrc('lemmagroup', urls.group);
      setSrc('tokengroup', urls.tokens);
      setSrc('traviz', 'error_docref.html');
      setSrc('docref', 'error_docref.html');
      document.title = lang_lemmafy + ' ' + curitem;
      // A summed list has no single focus and cannot be switched to a sum or percent view.
      highlightFocus(options.list ? -1 : focus);
      document.getElementById('switchtimelinesumbutton').disabled = options.list;
      document.getElementById('switchpercenttimelinebutton').disabled = options.list;
    };

    var itemClick = function (item) {
      var urls = buildVisUrls('lemma', item, exactOptions, focus);
      if (!urls) {
        return;
      }
      loading('timeline');
      loading('tokengroup');
      exactitem = item;
      setSrc('timeline', urls.timeline);
      setSrc('tokengroup', urls.tokens);
      updateTravizYear();
      document.title = lang_lemmafy + ' ' + exactitem;
      highlightFocus(focus);
      document.getElementById('switchtimelinesumbutton').disabled = false;
      document.getElementById('switchpercenttimelinebutton').disabled = false;
    };

    var updateFocus = function (newfocus) {
      focus = newfocus;
      if (exactitem.length > 0) {
        itemClick(exactitem);
      } else if (curitem.length > 0) {
        updateTimeline();
      }
    };

    var focus = 0;
    var curitem = '';
    var exactitem = '';
    highlightFocus(focus);
    restoreSearchFromLocation(document, window.location.search);
    if (document.getElementById('searchinput').value.trim().length > 0) {
      updateTimeline();
      document.getElementById('searchinput').scrollIntoView();
    } else {
      document.title = lang_lemmafy;
      setSrc('timeline', 'error_token.html');
      setSrc('lemmagroup', 'error_token.html');
      setSrc('tokengroup', 'error_token.html');
    }
  </script>
