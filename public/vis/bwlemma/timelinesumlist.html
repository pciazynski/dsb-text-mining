<!doctype html>
<meta charset="utf-8" />
<head>
  <script src="../../vendor/plotly.min.js"></script>
  <script src="../../js/def_language.js"></script>
  <script src="../../js/my_language.js"></script>
  <script src="../../js/datahandler.js"></script>
  <script src="../../js/config.js"></script>
  <script src="../../js/search.js"></script>
</head>

<body>
  <div id="myDiv"><!-- Plotly chart will be drawn inside this DIV --></div>
  <script>
    diagramtitle = '';
    var dataset = phpUrlFromLocation('data', 'lemma', window.location.search);
    var lemmalist = listTermsFromLocation(window.location.search);
    var ploturls = listPlotUrlsFromLocation('data', 'lemma', window.location.search);
    var searchOptions = readSearchOptions(window.location.search);
    var jitter = getQueryVariable('jitter');
    if (jitter.length == 0) {
      jitter = defjitter;
    } else {
      jitter = parseFloat(jitter);
    }
    diagramtitle = 'Jahressumme Lemma';
    if (searchOptions.ambig) {
      diagramtitle += ' inkl. ambig';
    }
    var rawPlotData = [];
    var maxval = 0;
    var minval = 10000000;
    var entrycount = 0;

    lemmalist.forEach(function (lemma, index) {
      var lemmacol = getColor('|' + lemma + '|');
      diagramtitle += ' <span style="color:' + lemmacol + '">' + lemma + '</span>';
      var dataset = ploturls[index];
      var data_arr = readPHP(dataset).split('\n');
      if (data_arr.length > resultsetmax) {
        document.write(lang_error_resultset_too_large);
      } else {
        rawPlotData.push(data_arr.join('\n'));
      }
    });

    var data = listPlotTraces(rawPlotData.join('\n'), sep);
    data.forEach(function (trace) {
      trace.marker = { opaciy: 0.2, color: getColor(trace.name) };
      entrycount += trace.x.length;
      trace.y.forEach(function (value) {
        minval = Math.min(minval, value);
        maxval = Math.max(maxval, value);
      });
    });

    if (getQueryVariable('scale') === 'log') {
      minval = Math.log(1);
      maxval = Math.log(maxval);
    } else {
      minval = 0;
      maxval = maxval + maxval / 10 + 1;
    }
    var layout = {
      hovermode: 'closest',
      title: {
        text: diagramtitle,
        font: diagramfont,
      },
      xaxis: {
        automargin: true,
        range: [minDate - 2, maxDate + 2],
        linewidth: 1,
        title: {
          font: diagramfont,
        },
        tickangle: 90,
        tickfont: diagramfont,
      },
      yaxis: {
        type: scale,
        range: [minval, maxval],
        title: {
          text: 'Häufigkeit (Abs)',
          font: diagramfont,
        },
      },
      annotations: watermarke(),
    };
    myPlot = Plotly.newPlot('myDiv', data, layout, plotlyconfiguration);
  </script>
</body>
